# Optional React UI. Keep the default Streamlit service available during migration.
# docker compose -f docker-compose.yml -f docker-compose.web.yml up -d --build web
services:
  web:
    build: ./frontend/web
    ports:
      - "127.0.0.1:${UPTIME_WEB_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
