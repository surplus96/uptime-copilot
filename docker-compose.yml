services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      ALLOWED_HOSTS: backend
      # xet(cas-bridge.xethub.hf.co)는 이 환경의 egress 필터와 궁합이 나빠 403/지연이 난다.
      # 1로 두면 huggingface_hub이 평범한 HTTPS CDN 경로로 내려받는다(공식 지원 옵션,
      # huggingface_hub 1.31.0 기준 - 2026-09-22 build-doctor 실측·확인).
      HF_HUB_DISABLE_XET: "1"
      # Compose environment overrides backend/.env. Current provider is OpenAI.
      # To use local Ollama, set LLM_PROVIDER to ollama; its URL below reaches the host.
      LLM_PROVIDER: openai
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    # 2026-09-30 build-doctor/security-reviewer: Linux Docker Engine에는 host.docker.internal이
    # 기본으로 없어서(Docker Desktop만 추가해 줌) Ollama/CMMS 호출이 DNS로 새거나 실패한다 -
    # /health는 200인데 첫 대화가 502로 나오는 식이다. host-gateway로 호스트에 고정한다.
    # (Docker Desktop에서는 같은 곳을 가리켜 무해. Linux 호스트에서의 실제 동작은 미검증.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./archive:/archive:ro
      - backend_store:/app/store
      # HF 임베딩 모델 캐시. 이게 없으면 재빌드마다 476MB를 다시 받는다
      # (실측: cold 118초 vs warm 6.4초). Dockerfile의 ENV HF_HOME=/opt/hf_cache와
      # 반드시 같은 경로여야 한다. 주의: `docker compose down -v`는 이 캐시도 지운다.
      - hf_cache:/opt/hf_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 캐시 볼륨이 비어있는 최초 1회(또는 down -v 이후)는 모델을 다시 받느라
      # 2분 안팎 걸릴 수 있다 - 넉넉히 잡는다. start_interval이 준비되는 즉시
      # healthy로 넘겨주므로, 평소(캐시 있음)엔 이 여유를 그대로 대가로 치르지 않는다.
      start_period: 600s
      start_interval: 5s
    # 종료 시 진행 중인 시뮬레이터 틱이 끝날 시간을 준다 - 기본 10초로는 SIGKILL 날 수 있다.
    stop_grace_period: 30s


  web:
    build: ./frontend/web
    ports:
      - "127.0.0.1:${UPTIME_WEB_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_store:
  hf_cache:
